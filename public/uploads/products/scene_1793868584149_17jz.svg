<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="studioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="50%" stop-color="#0C0C0E" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="luxuryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1F0E" />
      <stop offset="50%" stop-color="#12100E" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E082E" />
      <stop offset="50%" stop-color="#0A0B1A" />
      <stop offset="100%" stop-color="#020308" />
    </linearGradient>
    <linearGradient id="natureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2415" />
      <stop offset="50%" stop-color="#0B140E" />
      <stop offset="100%" stop-color="#050705" />
    </linearGradient>
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#121215" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#luxuryGrad)" />

  <!-- Atmospheric Glow -->
  <circle cx="300" cy="270" r="210" fill="#FF7A00" opacity="0.12" filter="url(#glow)" />

  <!-- Pedestal / Floor Stage -->
  <ellipse cx="300" cy="420" rx="228" ry="72" fill="url(#pedestalGrad)" stroke="#3F3F46" stroke-width="1.5" />
  <ellipse cx="300" cy="420" rx="192" ry="48" fill="#0C0C0E" opacity="0.6" />

  <!-- Central Product Silhouette & Emblem -->
  <rect x="220" y="180" width="160" height="220" rx="24" fill="#18181B" stroke="#FF7A00" stroke-width="2" filter="url(#glow)" />
  <rect x="230" y="192" width="140" height="196" rx="16" fill="#121215" />
  
  <!-- Product Hologram Ring -->
  <circle cx="300" cy="270" r="38" fill="none" stroke="#FCFBF8" stroke-width="3" stroke-dasharray="6,4" />
  <circle cx="300" cy="270" r="18" fill="#FF7A00" opacity="0.9" />

  <!-- Product Labels -->
  <text x="300" y="228" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">
    GLOWFIT AI BIOMETR
  </text>
  <text x="300" y="324" fill="#FCFBF8" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="1">
    WELLNESS • DRAMATIC RIM
  </text>

  <!-- Commercial Header & CTA Overlay -->
  <text x="300" y="72" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="18" font-weight="800" text-anchor="middle">
    Engineered for Flawless Performance
  </text>

  <!-- CTA Badge Button -->
  <rect x="180" y="516" width="240" height="42" rx="21" fill="#FF7A00" />
  <text x="300" y="542" fill="#000000" font-family="Inter, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">
    ORDER NOW • LIMITED EARLY BATCH
  </text>

  <!-- Telemetry Watermark -->
  <text x="584" y="586" fill="#71717A" font-family="monospace" font-size="9" text-anchor="end">
    RIIQX AI PRODUCT STUDIO • luxury_pedestal
  </text>
</svg>