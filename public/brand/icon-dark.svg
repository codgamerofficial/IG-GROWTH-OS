<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Card Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E1338" />
      <stop offset="60%" stop-color="#0E0C1C" />
      <stop offset="100%" stop-color="#070812" />
    </radialGradient>

    <!-- Aurora Ribbon Gradients -->
    <linearGradient id="aurora-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="25%" stop-color="#D946EF" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="75%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="i-stem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="20%" stop-color="#EC4899" />
      <stop offset="60%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="i-dot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE42" />
      <stop offset="40%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="arrow-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FFA07A" />
    </linearGradient>

    <linearGradient id="g-loop-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="35%" stop-color="#06B6D4" />
      <stop offset="65%" stop-color="#8B5CF6" />
      <stop offset="85%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Premium Glass Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-glow)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" filter="url(#subtle-shadow)" />

  <!-- Inner Ambient Aura Light -->
  <circle cx="280" cy="240" r="160" fill="#EC4899" opacity="0.16" filter="url(#soft-glow)" />
  <circle cx="210" cy="200" r="130" fill="#8B5CF6" opacity="0.22" filter="url(#soft-glow)" />

  <!-- === THE "i" SYMBOL === -->
  <!-- "i" Dot (Spherical glowing glass) -->
  <circle cx="166" cy="116" r="32" fill="url(#i-dot-grad)" filter="url(#soft-glow)" />
  <circle cx="156" cy="106" r="12" fill="#FFFFFF" opacity="0.5" />

  <!-- "i" Stem (Sleek elongated ribbon pill) -->
  <path d="M142 168 C142 154, 154 146, 168 146 C182 146, 194 154, 194 168 L194 340 C194 358, 180 372, 162 372 C144 372, 130 358, 130 340 L130 180 C130 172, 136 168, 142 168 Z" fill="url(#i-stem-grad)" filter="url(#soft-glow)" />
  <!-- Stem Glass Highlight -->
  <path d="M138 180 L138 330 C138 344, 146 354, 158 358" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4" />

  <!-- === THE "G" + UPWARD GROWTH ARROW SYMBOL === -->
  <!-- Upper "G" arch transitioning into upward surge -->
  <path d="M228 206 C238 144, 290 114, 348 118 C382 120, 410 138, 424 162 L384 188 C374 174, 358 164, 340 164 C304 164, 274 192, 272 238 L272 242 C272 284, 302 318, 344 318 C374 318, 396 304, 404 286 L340 286 C326 286, 320 274, 320 264 C320 252, 328 244, 342 244 L440 244 C454 244, 462 254, 462 268 C462 334, 410 380, 338 380 C246 380, 206 306, 208 244 C209 228, 218 214, 228 206 Z" fill="url(#g-loop-grad)" filter="url(#soft-glow)" />

  <!-- Upward Dynamic Growth Arrow Head (Integrated into G's upward trajectory) -->
  <path d="M370 184 L416 94 L458 198 L418 174 L370 184 Z" fill="url(#arrow-grad)" filter="url(#soft-glow)" />
  <path d="M416 94 L422 176 L458 198 Z" fill="#FFE4E6" opacity="0.3" />

  <!-- Subtle Core Rim Reflection -->
  <path d="M214 260 C216 320, 260 368, 330 368 C390 368, 436 330, 448 280" stroke="url(#arrow-grad)" stroke-width="4" stroke-linecap="round" opacity="0.6" />
</svg>
